name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename APKs
        run: |
          # 檔名加上版號，重複下載時才不會撞名
          ver() { grep -oP 'versionName = "\K[^"]+' "$1/build.gradle.kts"; }
          mkdir -p out
          mv app/build/outputs/apk/debug/app-debug.apk "out/tw-p4-launcher-$(ver app)-debug.apk"
          mv installer/build/outputs/apk/debug/installer-debug.apk "out/tw-p4-installer-$(ver installer)-debug.apk"
          ls out
      - uses: actions/upload-artifact@v7
        with:
          name: p4-launcher-debug-apk
          path: out/*.apk
