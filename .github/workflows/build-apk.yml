name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename APKs
        run: |
          mkdir -p out
          mv app/build/outputs/apk/debug/app-debug.apk out/tw-p4-launcher-debug.apk
          mv installer/build/outputs/apk/debug/installer-debug.apk out/tw-p4-installer-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: p4-launcher-debug-apk
          path: out/*.apk
